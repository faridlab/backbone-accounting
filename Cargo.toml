[package]
name = "backbone-accounting"
version = "0.9.4"
edition = "2021"
description = "GL, journals, ledger, reconciliation (extracted from bersihir)"

[lib]
path = "src/lib.rs"

[dependencies]
# Backbone Framework CORE dependencies
backbone-core = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.23", features = ["postgres"] }
backbone-orm = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.23" }
backbone-auth = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.23" }
backbone-messaging = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.23" }

# Core dependencies
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde"] }

# Database (PostgreSQL Primary)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }

# Protocol Buffers (Generated from Schema-First YAML)
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
pbjson = "0.7"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Validation helpers
regex = "1.0"

# HTTP Framework (Axum)
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Configuration
config = "0.14"
serde_yaml = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[features]
default = []
events = []
auth = []
grpc = []
openapi = []
validation = []

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
mockall = "0.12"
pretty_assertions = "1.0"
http-body-util = "0.1"

# Integration testing framework
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
jsonwebtoken = "9.3"
rand = "0.8"

# Lint posture.
#
# The families below are what the generated trees emit, not decisions this
# module made: the DTO conversions clone Copy values, the entity enums write
# `impl Default` by hand, the seeder pushes into a fresh vector, the generated
# constructors take one argument per column. They cannot be fixed here, because
# a regeneration puts them straight back, and left on they bury the warnings
# that do belong to hand-written code. The money literals in the tests group by
# cents on purpose (`Decimal::new(250_00, 2)` reads as 250.00).
#
# Anything outside this list is expected to stay at zero: `cargo clippy
# --all-targets` is part of the module's check routine.
[lints.clippy]
clone_on_copy = "allow"
default_constructed_unit_structs = "allow"
derivable_impls = "allow"
inconsistent_digit_grouping = "allow"
needless_borrows_for_generic_args = "allow"
too_many_arguments = "allow"
vec_init_then_push = "allow"
